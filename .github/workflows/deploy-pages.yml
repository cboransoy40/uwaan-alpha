name: Deploy UWAAN Alpha to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract alpha package
        shell: bash
        run: |
          set -euo pipefail
          test -f uwaan-alpha-ionos.zip || { echo "Upload uwaan-alpha-ionos.zip to repository root"; exit 1; }
          mkdir -p _site
          unzip -q uwaan-alpha-ionos.zip 'public/*' -d _extract
          cp -a _extract/public/. _site/
          test -f _site/index.html
          printf 'alfa.uwaan.com\n' > _site/CNAME
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
